name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Version, quality, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify single version source
        run: npm run verify:version

      - name: Verify quality gate
        run: npm run verify:quality

      - name: Build production app
        run: npm run build
